services:
  sunnygen:
    build:
      context: .
      args:
        UID: '${SUNNYGEN_UID:-1000}'
        GID: '${SUNNYGEN_GID:-1000}'
    image: sunnygen:prod
    container_name: sunnygen-prod
    init: true
    network_mode: host
    volumes:
      - ${SUNNYGEN_PROD_DATA:-${HOME}/.local/share/sunnygen-prod/data}:/data
    restart: unless-stopped

  cobalt:
    profiles: [cobalt]
    image: ghcr.io/imputnet/cobalt:11
    container_name: sunnygen-cobalt
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'
    environment:
      API_URL: 'http://cobalt:9000/'
      CORS_WILDCARD: '0'
      TUNNEL_LIFESPAN: '300'
      RATELIMIT_MAX: '60'
    # Optional: uncomment to read logged-in cookies for services that need them
    # (Instagram and others). Place cookies.json beside this file.
    # volumes:
    #   - ./cobalt-cookies.json:/cookies.json:ro
    # environment also needs: COOKIE_PATH: "/cookies.json"
