<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ef" />
    <title>SunnyGen · Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #faf6ef;
        color: #2a1e17;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto;
        max-width: 300px;
        color: #6b5a4e;
        font-size: 14px;
        line-height: 1.6;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 12px;
        background: #a31621;
        color: #fff;
        padding: 10px 18px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You’re offline.</h1>
      <p>
        SunnyGen kept its shell available. Reconnect to load renders, assets, and provider jobs — everything
        is still on your machine.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
